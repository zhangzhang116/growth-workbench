<title>张张的成长工作台</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap');
:root{
  --pink1:#FFF8FA;--pink2:#FFE5EE;--pink3:#FFD0E0;--pink4:#FFB6C1;--pink5:#FF69B4;--pink6:#FF4080;
  --cream:#FFF9F5;--bg:#FEF6F9;--card:#FFFFFF;--text1:#5A3A4A;--text2:#8A6A7A;--shadow:0 2px 12px rgba(255,105,180,0.08);
  --good:#4CAF50;--bad:#FF5252;--warn:#FFB74D;--green:#66BB6A;--water:#42A5F5;--tree:#81C784;
  --radius:14px;--radius-sm:10px;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito','Microsoft YaHei',sans-serif}
body{background:var(--bg);color:var(--text1);min-height:100vh;overflow-x:hidden}
.app{display:flex;height:100vh}

/* ========== 左侧导航 ========== */
.sidebar{width:220px;background:linear-gradient(180deg,#FFF5F8 0%,#FFEEF3 100%);border-right:1px solid var(--pink2);display:flex;flex-direction:column;padding:14px 10px;position:relative;z-index:10;transition:transform .3s}
.brand{text-align:center;padding:6px 0 14px;font-size:15px;font-weight:700;color:var(--pink6);letter-spacing:1px;border-bottom:1px dashed var(--pink3);margin-bottom:8px}
.brand .bow{font-size:18px;display:inline-block;animation:sway 2.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.nav-item{display:flex;align-items:center;padding:8px 12px;margin:3px 0;border-radius:var(--radius-sm);cursor:pointer;transition:all .25s;font-size:12.5px;color:var(--text1);position:relative;gap:8px}
.nav-item:hover{background:var(--pink2);transform:translateX(3px)}
.nav-item.active{background:linear-gradient(90deg,var(--pink3),var(--pink2));color:var(--pink6);font-weight:700;box-shadow:var(--shadow)}
.nav-icon{width:24px;height:24px;border-radius:50%;background:var(--pink2);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.nav-item.active .nav-icon{background:var(--pink5);color:#fff}
.nav-count{font-size:10px;background:var(--pink5);color:#fff;padding:1px 6px;border-radius:10px;margin-left:auto}
.nav-check{font-size:10px;margin-left:auto;color:var(--good)}
.reset-btn{width:100%;padding:7px;border:1px dashed var(--pink5);border-radius:8px;background:linear-gradient(135deg,var(--pink1),var(--cream));color:var(--pink6);font-size:11px;font-weight:700;cursor:pointer;transition:all .2s}
.reset-btn:hover{background:linear-gradient(135deg,var(--pink2),var(--pink3));border-color:var(--pink6);transform:scale(1.02)}
.menu-btn{display:none;position:fixed;top:12px;left:12px;z-index:100;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--pink3);font-size:18px;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:9}

/* ========== 右侧主内容 ========== */
.main{flex:1;overflow-y:auto;padding:10px 14px 90px;scroll-behavior:smooth}
.main::-webkit-scrollbar{width:5px}
.main::-webkit-scrollbar-thumb{background:var(--pink3);border-radius:3px}
.me-footer{margin-top:6px;padding-top:14px;border-top:2px solid var(--pink3)}

/* ========== 底部导航栏 ========== */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--card);border-top:1px solid var(--pink2);display:flex;align-items:center;justify-content:space-around;z-index:60;box-shadow:0 -2px 12px rgba(255,105,180,0.08);padding-bottom:env(safe-area-inset-bottom,0)}
.bottom-nav .bn-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:4px 14px;border-radius:12px;transition:all .2s;font-size:10px;color:var(--text2);min-width:56px;position:relative}
.bottom-nav .bn-item .bn-icon{font-size:20px;line-height:1;transition:transform .2s}
.bottom-nav .bn-item.active{color:var(--pink6);font-weight:700}
.bottom-nav .bn-item.active .bn-icon{transform:scale(1.15)}
.bottom-nav .bn-item:active{transform:scale(.95)}
.bottom-nav .bn-dot{position:absolute;top:2px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--pink5)}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px dashed var(--pink3)}
.header h2{font-size:16px;color:var(--pink6);display:flex;align-items:center;gap:6px}
.header h2 .icon{font-size:18px}
.date-tag{background:var(--pink2);color:var(--pink6);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700}

/* ========== 卡片 ========== */
.card{background:var(--card);border-radius:var(--radius);padding:10px;margin-bottom:8px;box-shadow:var(--shadow);border:1px solid var(--pink1);animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card-title{font-size:12px;font-weight:700;color:var(--pink6);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.card-title .dot{width:6px;height:6px;border-radius:50%;background:var(--pink5)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* ========== 任务清单 ========== */
.task-item{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--cream);border-radius:var(--radius-sm);margin:3px 0;font-size:11px;transition:all .2s}
.task-item:hover{background:var(--pink1);transform:translateX(2px)}
.task-item.done{opacity:.55;text-decoration:line-through}
.task-item.done .task-text{color:var(--text2)}
.task-check{width:18px;height:18px;border:2px solid var(--pink4);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0;transition:all .2s}
.task-check:hover{border-color:var(--pink5)}
.task-check.checked{background:var(--pink5);border-color:var(--pink5)}
.task-text{flex:1}
.task-del{background:none;border:none;color:var(--pink4);cursor:pointer;font-size:14px;padding:0 4px;opacity:0;transition:opacity .2s}
.task-item:hover .task-del{opacity:1}
.task-del:hover{color:var(--bad)}
.task-add{display:flex;gap:6px;margin-top:8px}
.task-add input{flex:1;padding:7px 12px;border:1px solid var(--pink3);border-radius:var(--radius-sm);font-size:12px;background:var(--cream);outline:none}
.task-add input:focus{border-color:var(--pink5)}
.btn{padding:7px 16px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-weight:700;transition:all .2s;white-space:nowrap}
.btn-pri{background:linear-gradient(135deg,var(--pink5),var(--pink6));color:#fff;box-shadow:0 2px 8px rgba(255,105,180,.3)}
.btn-pri:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(255,105,180,.4)}
.btn-sec{background:var(--pink2);color:var(--pink6)}
.btn-sec:hover{background:var(--pink3)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-timer{padding:4px 8px;font-size:10px;border-radius:8px;background:var(--cream);border:1px solid var(--pink3);color:var(--pink6);cursor:pointer;transition:all .2s}
.btn-timer:hover,.btn-timer.active{background:var(--pink5);color:#fff;border-color:var(--pink5)}

/* ========== 打卡区域 ========== */
.checkin-area{text-align:center;padding:10px;background:linear-gradient(135deg,var(--pink1),var(--cream));border-radius:var(--radius);border:1px dashed var(--pink3);margin-bottom:8px}
.checkin-area .days{font-size:28px;font-weight:800;color:var(--pink6);line-height:1}
.checkin-area .days-label{font-size:11px;color:var(--text2);margin:4px 0 8px}
.checkin-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 24px;background:linear-gradient(135deg,var(--pink5),var(--pink6));color:#fff;border:none;border-radius:24px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 3px 12px rgba(255,105,180,.35);transition:all .3s}
.checkin-btn:hover{transform:scale(1.04);box-shadow:0 5px 18px rgba(255,105,180,.45)}
.checkin-btn:disabled{background:#ccc;cursor:not-allowed;box-shadow:none;transform:none}
.streak-info{font-size:11px;color:var(--text2);margin-top:6px}
.reward-badges{display:flex;justify-content:center;gap:10px;margin-top:8px;font-size:11px}
.reward-badge{background:var(--card);padding:3px 10px;border-radius:12px;border:1px solid var(--pink3);display:flex;align-items:center;gap:4px}

/* ========== 计时器 ========== */
.timer-box{background:linear-gradient(135deg,#FFF5F8,#FFF0F5);border-radius:var(--radius);padding:10px;text-align:center;border:1px dashed var(--pink3);margin-bottom:8px}
.timer-display{font-size:36px;font-weight:800;color:var(--pink6);font-family:'Courier New',monospace;letter-spacing:2px}
.timer-label{font-size:11px;color:var(--text2);margin-bottom:8px}
.timer-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:8px}

/* ========== 进度条 ========== */
.progress-wrap{background:var(--pink1);border-radius:10px;height:10px;overflow:hidden;margin:6px 0}
.progress-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--pink4),var(--pink5));transition:width .5s ease}
.progress-text{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:2px}

/* ========== 健身周历 ========== */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px}
.week-day{text-align:center;padding:8px 4px;background:var(--cream);border-radius:var(--radius-sm);font-size:11px;border:1px solid var(--pink1);cursor:pointer;transition:all .2s;position:relative}
.week-day:hover{border-color:var(--pink4)}
.week-day.active{background:var(--pink2);border-color:var(--pink5);color:var(--pink6);font-weight:700}
.week-day .wk-num{font-size:9px;color:var(--text2);margin-bottom:2px}
.week-day .wk-check{font-size:14px;margin-top:2px}
.workout-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.summary-box{text-align:center;padding:10px;background:var(--cream);border-radius:var(--radius-sm);border:1px solid var(--pink1)}
.summary-box .num{font-size:20px;font-weight:800;color:var(--pink6)}
.summary-box .lbl{font-size:10px;color:var(--text2);margin-top:2px}

/* ========== 视频区 ========== */
.video-area{margin-top:12px}
.video-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.video-card{background:var(--cream);border-radius:var(--radius-sm);padding:8px;text-align:center;border:1px solid var(--pink1);position:relative}
.video-card video{width:100%;border-radius:8px}
.video-card .v-name{font-size:11px;margin-top:4px;color:var(--text1)}
.video-card .v-del{position:absolute;top:4px;right:4px;background:var(--bad);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;display:none}
.video-card:hover .v-del{display:block}
.video-cat-tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:9px;margin-top:3px;font-weight:600;background:var(--pink2);color:var(--pink6)}
.video-cat-filter{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.video-cat-filter .cat-btn{padding:2px 10px;border-radius:12px;border:1px solid var(--pink3);background:var(--cream);font-size:10px;cursor:pointer;color:var(--text2);transition:all .2s}
.video-cat-filter .cat-btn:hover,.video-cat-filter .cat-btn.active{background:var(--pink4);color:#fff;border-color:var(--pink4)}
.bili-embed{width:100%;aspect-ratio:16/9;border-radius:var(--radius-sm);border:none;margin-top:8px}
.bili-input{display:flex;gap:6px;margin-top:8px}
.bili-input input{flex:1;padding:6px 10px;border:1px solid var(--pink3);border-radius:var(--radius-sm);font-size:11px;outline:none}
.bili-card{background:var(--cream);border-radius:var(--radius-sm);padding:10px;margin-bottom:8px;border:1px solid var(--pink1);position:relative;display:flex;align-items:center;gap:10px;transition:all .2s;cursor:pointer}
.bili-card:hover{border-color:var(--pink5);background:var(--pink1);transform:translateY(-1px)}
.bili-card .bili-thumb{width:90px;height:60px;background:linear-gradient(135deg,var(--pink3),var(--pink5));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;flex-shrink:0;position:relative;overflow:hidden}
.bili-card .bili-thumb::after{content:'▶';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;background:rgba(0,0,0,.25);opacity:0;transition:opacity .2s}
.bili-card:hover .bili-thumb::after{opacity:1}
.bili-card .bili-info{flex:1;min-width:0}
.bili-card .bili-title{font-size:12px;font-weight:700;color:var(--text1);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bili-card .bili-meta{font-size:10px;color:var(--text2)}
.bili-card .bili-del{background:var(--bad);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:13px;cursor:pointer;flex-shrink:0}
.bili-card .bili-cat{display:inline-block;padding:1px 6px;border-radius:8px;font-size:9px;background:var(--pink2);color:var(--pink6);font-weight:600;margin-left:4px}

/* ========== 学习路径时间线 ========== */
.path-line{position:relative;padding-left:34px}
.path-line::before{content:'';position:absolute;left:14px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,var(--pink4),var(--pink5))}
.path-step{position:relative;margin-bottom:12px}
.path-step::before{content:attr(data-num);position:absolute;left:-30px;top:4px;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--pink5),var(--pink6));color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(255,105,180,.3)}
.path-step .step-title{font-size:12px;font-weight:700;color:var(--text1);margin-bottom:2px}
.path-step .step-desc{font-size:10px;color:var(--text2);line-height:1.5}

/* ========== 资源卡片 ========== */
.resource-card{background:linear-gradient(135deg,var(--cream),var(--pink1));border-radius:var(--radius-sm);padding:10px;margin-bottom:6px;border:1px solid var(--pink2);display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .2s}
.resource-card:hover{border-color:var(--pink5);background:linear-gradient(135deg,var(--pink1),var(--pink2));transform:translateX(2px)}
.resource-card .rc-icon{width:38px;height:38px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.resource-card .rc-info{flex:1;min-width:0}
.resource-card .rc-name{font-size:12px;font-weight:700;color:var(--text1);margin-bottom:2px}
.resource-card .rc-desc{font-size:10px;color:var(--text2)}
.resource-card .rc-arrow{color:var(--pink4);font-size:14px}

/* ========== 存钱目标 ========== */
.savings-card{background:linear-gradient(135deg,#FFF5F8,#FFF0F5);border-radius:var(--radius);padding:10px;border:1px dashed var(--pink3);margin-bottom:8px}
.savings-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.savings-title{font-size:11px;font-weight:700;color:var(--pink6)}
.savings-amount{font-size:20px;font-weight:800;color:var(--pink6)}
.savings-amount .small{font-size:12px;color:var(--text2);font-weight:400}
.savings-plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px;margin-top:8px}
.plan-card{background:var(--card);border-radius:var(--radius-sm);padding:7px;border:1px solid var(--pink2);position:relative}
.plan-card .plan-name{font-size:10px;font-weight:700;color:var(--text1);margin-bottom:2px}
.plan-card .plan-progress{font-size:9px;color:var(--text2);margin-bottom:3px}
.plan-card .plan-bar{height:4px;background:var(--pink1);border-radius:2px;overflow:hidden}
.plan-card .plan-bar-fill{height:100%;background:var(--pink5);border-radius:3px;transition:width .5s}
.plan-card .plan-add{font-size:10px;color:var(--pink6);cursor:pointer;margin-top:6px;text-align:center;padding:4px;border:1px dashed var(--pink3);border-radius:6px}
.plan-card .plan-add:hover{background:var(--pink1)}
.plan-card .plan-del{position:absolute;top:4px;right:4px;color:var(--pink4);cursor:pointer;font-size:12px;opacity:0;transition:opacity .2s}
.plan-card:hover .plan-del{opacity:1}
.plan-card:hover .plan-del:hover{color:var(--bad)}

/* ========== 记账 ========== */
.money-inp{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.money-inp input,.money-inp select{padding:4px 7px;border:1px solid var(--pink3);border-radius:var(--radius-sm);font-size:10px;outline:none;background:var(--cream)}
.money-inp input[type="number"]{width:75px}
.money-inp select{width:85px}
.expense-list{max-height:200px;overflow-y:auto}
.exp-item{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;border-bottom:1px solid var(--pink1);font-size:10px}
.exp-item:last-child{border-bottom:none}
.cat-tag{font-size:9px;padding:2px 7px;border-radius:10px;color:#fff;margin-right:6px;font-weight:600}
.cat-tag.food{background:#FF8A65}.cat-tag.clothes{background:#BA68C8}.cat-tag.traffic{background:#64B5F6}
.cat-tag.ent{background:#FFD54F;color:#5A3A4A}.cat-tag.beauty{background:#F06292}.cat-tag.other{background:#A1887F}
.exp-total{font-size:11px;font-weight:700;color:var(--pink6);text-align:right;padding:6px;border-top:1px solid var(--pink3);margin-top:4px}
.chart-bar{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:10px}
.chart-bar .lbl{width:40px;text-align:right;color:var(--text2)}
.chart-bar .bar-wrap{flex:1;height:7px;background:var(--pink1);border-radius:4px;overflow:hidden}
.chart-bar .bar{height:100%;border-radius:4px;transition:width .5s ease}
.chart-bar .val{width:35px;text-align:left;font-weight:700;font-size:9px}

/* ========== 饮食 ========== */
.meal-section{margin-bottom:12px}
.meal-title{font-size:12px;font-weight:700;color:var(--text1);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.meal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.meal-item{text-align:center;padding:6px;background:var(--cream);border-radius:var(--radius-sm);border:1px solid var(--pink1);cursor:pointer;font-size:10px;transition:all .2s;position:relative}
.meal-item:hover{border-color:var(--pink4)}
.meal-item.selected{background:var(--pink2);border-color:var(--pink5);color:var(--pink6);font-weight:700}
.meal-item .meal-img{width:100%;aspect-ratio:1;border-radius:6px;object-fit:cover;margin-bottom:3px}
.meal-item .meal-name{font-size:9px;line-height:1.2}
.meal-item .meal-cal{font-size:8px;color:var(--text2)}
.meal-input{display:flex;gap:6px;margin-top:6px}
.meal-input input{flex:1;padding:5px 8px;border:1px solid var(--pink3);border-radius:var(--radius-sm);font-size:11px;outline:none;background:var(--cream)}
.meal-cal-display{text-align:center;padding:8px;background:linear-gradient(135deg,#FFF5F8,#FFF0F5);border-radius:var(--radius-sm);margin-top:8px;font-size:12px}
.meal-cal-display .cal-num{font-size:24px;font-weight:800;color:var(--pink6)}

/* ========== 变美 ========== */
.hair-record{background:var(--cream);border-radius:var(--radius-sm);padding:10px;margin-bottom:10px;border:1px solid var(--pink1)}
.hair-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px dashed var(--pink2);font-size:11px}
.hair-item:last-child{border-bottom:none}
.hair-input{display:flex;gap:6px;margin-top:6px}
.hair-input input{flex:1;padding:5px 8px;border:1px solid var(--pink3);border-radius:var(--radius-sm);font-size:11px;outline:none;background:var(--card)}
.skin-track{display:flex;align-items:center;gap:10px;padding:10px;background:var(--cream);border-radius:var(--radius-sm);margin-bottom:10px;border:1px solid var(--pink1)}
.skin-track .skin-cal{width:36px;height:36px;border-radius:50%;background:var(--pink2);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:all .2s}
.skin-track .skin-cal:hover{background:var(--pink3)}
.skin-track .skin-cal.done{background:var(--good);color:#fff}
.skin-track .skin-info{flex:1;font-size:11px;color:var(--text2)}

/* ========== 衣帽间 ========== */
.closet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:8px}
.closet-item{text-align:center;padding:6px;background:var(--cream);border-radius:var(--radius-sm);border:1px solid var(--pink1);cursor:grab;position:relative;transition:all .2s}
.closet-item:active{cursor:grabbing;transform:scale(1.05);box-shadow:var(--shadow);z-index:10}
.closet-item img{width:100%;aspect-ratio:3/4;border-radius:6px;object-fit:cover}
.closet-item .ci-name{font-size:9px;margin-top:3px;color:var(--text1)}
.closet-item .ci-del{position:absolute;top:2px;right:2px;background:var(--bad);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:10px;cursor:pointer;display:none}
.closet-item:hover .ci-del{display:block}
.closet-upload{margin-top:8px;padding:10px;border:2px dashed var(--pink3);border-radius:var(--radius-sm);text-align:center;cursor:pointer;font-size:11px;color:var(--text2);transition:all .2s}
.closet-upload:hover{border-color:var(--pink5);color:var(--pink6);background:var(--pink1)}

/* ========== 养猫种树 ========== */
.game-section{padding:20px;background:linear-gradient(180deg,#FFF8FA 0%,#FFF0F5 100%);border-radius:var(--radius);border:1px dashed var(--pink3);text-align:center;margin-top:16px}
.game-title{font-size:16px;font-weight:800;color:var(--pink6);margin-bottom:14px}
.game-assets{display:flex;justify-content:center;gap:30px;margin-bottom:16px;flex-wrap:wrap}
.asset-box{text-align:center;padding:12px 20px;background:var(--card);border-radius:var(--radius);border:1px solid var(--pink2);box-shadow:var(--shadow);min-width:90px}
.asset-box .asset-icon{font-size:28px;margin-bottom:4px;animation:kittyBounce 2s infinite}
.asset-box .asset-num{font-size:22px;font-weight:800;color:var(--pink6)}
.asset-box .asset-label{font-size:10px;color:var(--text2)}
@keyframes kittyBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes treeGrow{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.game-scene{position:relative;height:180px;background:linear-gradient(180deg,#E8F5E9 0%,#C8E6C9 60%,#A5D6A7 100%);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;border:1px solid var(--pink2)}
.game-scene .sky{position:absolute;top:10px;right:20px;font-size:20px;animation:float 3s ease-in-out infinite}
.game-scene .ground{position:absolute;bottom:0;left:0;right:0;height:30px;background:linear-gradient(180deg,#81C784,#66BB6A)}
.game-scene .kitty{position:absolute;bottom:28px;left:30%;font-size:36px;transition:all .5s;z-index:5}
.game-scene .tree{position:absolute;bottom:28px;right:25%;font-size:0;transition:all .5s;z-index:4}
.game-scene .tree .trunk{font-size:24px;position:absolute;bottom:0;left:50%;transform:translateX(-50%)}
.game-scene .tree .leaves{font-size:32px;position:absolute;bottom:18px;left:50%;transform:translateX(-50%)}
.game-scene .tree.grown .leaves{font-size:48px;animation:treeGrow 2s ease-in-out infinite}
.game-scene .food-bowl{position:absolute;bottom:28px;left:55%;font-size:24px;z-index:3}
.game-scene .zombie{position:absolute;bottom:28px;left:-50px;font-size:32px;transition:all 1s;z-index:6}
.game-scene .zombie.show{left:15%}
.game-scene .zombie.eat{animation:zombieEat .8s ease-in-out}
@keyframes zombieEat{0%{transform:scale(1)}25%{transform:scale(1.2) rotate(-10deg)}50%{transform:scale(1.3) rotate(10deg)}75%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(5deg)}}
.game-scene .cloud{position:absolute;top:15px;font-size:18px;opacity:.7;animation:cloudMove 15s linear infinite}
@keyframes cloudMove{from{left:-30px}to{left:100%}}
.game-scene .rain{position:absolute;width:2px;height:8px;background:#42A5F5;opacity:.6;animation:rainDrop .8s linear infinite}
@keyframes rainDrop{from{top:0;opacity:1}to{top:100px;opacity:0}}

.glog{font-size:11px;color:var(--text2);margin-top:8px;min-height:20px}
.glog .ent{display:inline-block;padding:3px 10px;background:var(--cream);border-radius:10px;margin:2px;font-size:10px}
.glog .ent.good{color:var(--good);background:#E8F5E9}
.glog .ent.bad{color:var(--bad);background:#FFEBEE}
.glog .ent.info{color:var(--water);background:#E3F2FD}

/* 兑换商店 */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.shop-item{text-align:center;padding:10px 6px;background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--pink2);transition:all .2s}
.shop-item:hover{border-color:var(--pink5);transform:translateY(-2px)}
.shop-item .si-icon{font-size:24px;margin-bottom:4px}
.shop-item .si-name{font-size:11px;font-weight:700;color:var(--text1)}
.shop-item .si-cost{font-size:10px;color:var(--pink6);margin:3px 0}
.shop-item .si-btn{padding:4px 12px;font-size:10px;margin-top:4px}

/* ========== 弹窗 ========== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);padding:20px;max-width:340px;width:90%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.15);animation:popIn .3s ease;border:1px solid var(--pink2)}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-size:16px;font-weight:800;color:var(--pink6);margin-bottom:10px}
.modal-text{font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.6}
.modal-icon{font-size:48px;margin-bottom:10px;animation:shake .6s ease}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.modal-btns{display:flex;gap:8px;justify-content:center}
.modal-btns .btn{flex:1}

/* ========== 打卡记录 ========== */
.checkin-log{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;justify-content:center}
.checkin-log .log-dot{width:20px;height:20px;border-radius:50%;background:var(--pink1);display:flex;align-items:center;justify-content:center;font-size:10px;border:1px solid var(--pink2)}
.checkin-log .log-dot.done{background:var(--good);color:#fff;border-color:var(--good)}
.checkin-log .log-dot.miss{background:var(--bad);color:#fff;border-color:var(--bad)}

/* ========== 目标编辑 ========== */
.goal-input{width:60px;padding:3px 6px;border:1px solid var(--pink3);border-radius:6px;font-size:11px;text-align:center;outline:none;background:var(--cream)}

/* ========== 天气卡片 ========== */
.weather-card{background:linear-gradient(135deg,#FFE5B4 0%,#FFD0E0 50%,#FFB6C1 100%);border-radius:var(--radius);padding:12px;margin-bottom:8px;color:#5A3A4A;position:relative;overflow:hidden;animation:fadeUp .4s ease}
.weather-card .w-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.weather-card .w-temp{font-size:36px;font-weight:800;line-height:1;color:#FF4080}
.weather-card .w-icon{font-size:48px;line-height:1;animation:float 3s ease-in-out infinite}
.weather-card .w-info{flex:1}
.weather-card .w-city{font-size:13px;font-weight:700;color:#5A3A4A;margin-bottom:2px}
.weather-card .w-desc{font-size:11px;color:#8A6A7A}

function localDate(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){return localDate();}
function yestStr(){const d=new Date();d.setDate(d.getDate()-1);return localDate(d);}
function streak(c){if(!c||!c.length)return 0;const s=[...new Set(c)].sort();let k=0,t=new Date();for(let i=0;i<365;i++){const d=localDate(t);if(s.includes(d))k++;else if(i>0)break;t.setDate(t.getDate()-1);}return k;}
function dateLabel(d){const n=new Date(d);return `${n.getMonth()+1}/${n.getDate()}`;}

// ========== 天气 ==========
// 使用 wttr.in 提供的免费天气接口（无需 API key）
async function fetchWeather(force=false){
  const now=Date.now();
  if(!force && weatherCache.data && (now-weatherCache.time)<30*60*1000){
    renderWeather(weatherCache.data);
    return;
  }
  const wEl=document.getElementById('weatherCard');
  if(wEl)wEl.innerHTML='<div class="weather-loading">☁️ 正在获取实时天气...</div>';

  // 尝试获取定位
  try{
    if(navigator.geolocation && !weatherCache.lat){
      await new Promise((resolve)=>{
        navigator.geolocation.getCurrentPosition(
          pos=>{weatherCache.lat=pos.coords.latitude;weatherCache.lon=pos.coords.longitude;resolve();},
          ()=>{weatherCache.lat=39.9042;weatherCache.lon=116.4074;resolve();},
          {timeout:4000,maximumAge:600000}
        );
      });
    }
  }catch(e){
    weatherCache.lat=weatherCache.lat||39.9042;
    weatherCache.lon=weatherCache.lon||116.4074;
  }

  const lat=weatherCache.lat||39.9042,lon=weatherCache.lon||116.4074;
  // 使用 wttr.in JSON 接口（无需 key）
  const url=`https://wttr.in/${lat},${lon}?format=j1&lang=zh`;
  try{
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('weather api fail');
    const data=await res.json();
    const cur=data.current_condition?.[0]||{};
    const area=data.nearest_area?.[0]||{};
    const cityName=(area.areaName?.[0]?.value)||(area.region?.[0]?.value)||'当前位置';
    const desc=cur.lang_zh?.[0]?.value||cur.weatherDesc?.[0]?.value||'晴';
    const temp=cur.temp_C;
    const feels=cur.FeelsLikeC;
    const humidity=cur.humidity;
    const wind=cur.windspeedKmph;
    const uv=cur.uvIndex;
    const vis=cur.visibility;
    weatherCache.data={city:cityName,desc,temp,feels,humidity,wind,uv,vis};
    weatherCache.time=now;
    weatherCache.city=cityName;
    renderWeather(weatherCache.data);
  }catch(e){
    // 失败时显示默认
    if(weatherCache.data){
      renderWeather(weatherCache.data);
    }else{
      const w=document.getElementById('weatherCard');
      if(w)w.innerHTML=`<div class="weather-card">
        <div class="w-top">
          <div class="w-info">
            <div class="w-city">📍 北京市</div>
            <div class="w-desc">晴朗 · 25°C</div>
          </div>
          <div class="w-temp">25°</div>
          <div class="w-icon">☀️</div>
        </div>
        <div class="w-details">
          <span>💧 湿度 45%</span>
          <span>🌬️ 微风</span>
          <span>👁️ 能见度良好</span>
        </div>
        <button class="w-refresh" onclick="fetchWeather(true)" title="刷新">↻</button>
      </div>`;
    }
  }
}

  desc=(desc||'').toLowerCase();

  if(/多云|阴/.test(desc))return'⛅';
  if(/雨/.test(desc))return'🌧️';
  if(/雪/.test(desc))return'❄️';

// 解析时间段字符串 "08:00-08:30" → {startTime,endTime}
function parseRange(str){
  if(!str)return{startTime:'',endTime:''};
  const m=str.match(/(\d{1,2}[:：]?\d{0,2})\s*[-–~至到]+\s*(\d{1,2}[:：]?\d{0,2})/);
  if(m){
    return{startTime:normalizeTime(m[1]),endTime:normalizeTime(m[2])};
  }
  // 单时间点
  return{startTime:normalizeTime(str),endTime:''};
}
function normalizeTime(s){
  if(!s)return'';
  s=s.replace(/：/g,':');
  if(!s.includes(':')){
    if(s.length<=2)s=s+':00';
    else s=s.slice(0,s.length-2)+':'+s.slice(-2);
  }
  const parts=s.split(':');
  const h=parts[0].padStart(2,'0');
  const m=(parts[1]||'00').padStart(2,'0');
  return h+':'+m;
}
function parseTimeRange(i,val){
  const{startTime,endTime}=parseRange(val);
  st.timeSlots[i].startTime=startTime;
  st.timeSlots[i].endTime=endTime;
  saveSt();
}

function addVideo(mid){

    st.videos[mid].push({name:f.name,url:e.target.result,category:cat,date:todayStr()});

            '<button class="btn btn-pri" onclick="openExternalVideo()">📱 打开B站</button>'

function getBvid(url){
  if(!url)return null;
  const m=url.match(/BV([a-zA-Z0-9]+)/i);
  if(m)return m[1];
  const m2=url.match(/video\/([a-zA-Z0-9]+)/i);
  if(m2)return m2[1];
  const m3=url.match(/av(\d+)/i);
  if(m3)return m3[1];
  return null;
}

  st.bili[mid]=st.bili[mid]||[];

  st.bili[mid].push(url);
  st.biliMeta[mid].push({title:'B站视频 '+(st.bili[mid].length),cat:'其他',date:todayStr()});
  inp.value='';

function openBili(url){
  if(!url)return;
  // 尝试唤起B站App，否则打开网页
  const bvid=getBvid(url);
  const isAV=url.match(/av(\d+)/i);
  let appUrl='';
  if(bvid){
    appUrl=`bilibili://video/${bvid}`;
  }else if(isAV){
    appUrl=`bilibili://video/av${isAV[1]}`;
  }
  const webUrl=bvid?`https://www.bilibili.com/video/BV${bvid}`:url;

  if(appUrl){
    // 有 BV 号：尝试唤起 App
    const start=Date.now();
    const iframe=document.createElement('iframe');
    iframe.style.display='none';
    iframe.src=appUrl;
    document.body.appendChild(iframe);
    setTimeout(()=>{
      try{document.body.removeChild(iframe);}catch(e){}
      if((Date.now()-start)<2200){
        try{window.open(webUrl,'_blank');}catch(e){location.href=webUrl;}
      }
    },2000);
  }else{
    // 搜索/普通链接：直接打开B站网页
    try{window.open(webUrl,'_blank');}catch(e){location.href=webUrl;}
  }
}

  const sk=s>=7?3:s>=3?2:1;

  switch(mid){
    case 'today': renderToday(main,t,done,s,sk); break;
    case 'fitness': renderFitness(main,t,done,s,sk); break;
    case 'english': renderEnglish(main,t,done,s,sk); break;
    case 'computer': renderComputer(main,t,done,s,sk); break;
    case 'money': renderMoney(main,t); break;
    case 'diet': renderDiet(main,t,done,s,sk); break;
    case 'beauty': renderBeauty(main,t); break;
    case 'catgame': renderCatGame(main,t); break;
    case 'me': renderMePage(main,t); break;
  }
  updateBottomNav();
  window.scrollTo(0,0);
}

          h+=`</div>`;
        });
        h+=`</div>`;
      }
      h+=`</div>`;
    }
  }
  h+='</div>';
  return h;
}

// B站链接解析：BV号、av号、完整URL、b23.tv短链
function bvidFromUrl(input){
  if(!input)return null;
  input=input.trim();
  let m=input.match(/(BV[a-zA-Z0-9]{10})/);
  if(m)return m[1];
  m=input.match(/av(\d+)/i);
  if(m)return 'av'+m[1];
  return null;
}

// 启动时把所有预设视频的 b23.tv 短链解析为完整 BV号（同步HTTP请求）
function resolveShortUrls(){
  const allCats=[...Object.keys(FIT_VIDEOS||{}),'engBili','csBili'];
  const promises=[];
  allCats.forEach(cat=>{
    let arr;
    if(cat==='engBili')arr=ENG_VIDEOS;
    else if(cat==='csBili')arr=CS_VIDEOS;
    else arr=FIT_VIDEOS[cat];
    if(!arr)return;
    // ENG_VIDEOS/CS_VIDEOS 是对象（按分类），需要展平
    const vidList=Array.isArray(arr)?arr:Object.values(arr).flat();
    vidList.forEach(v=>{
      if(v.url&&v.url.includes('b23.tv')&&!v._resolved){
        promises.push(
          fetch(v.url,{method:'HEAD',redirect:'follow'}).then(r=>{
            const bvid=r.url?r.url.match(/(BV[a-zA-Z0-9]{10})/)?.[1]:null;
            if(bvid){v.url=`https://www.bilibili.com/video/${bvid}`;v._resolved=true}
          }).catch(()=>{})
        );
      }
    });
  });
  return Promise.all(promises);
}
function biliEmbedUrl(url){
  if(!url)return'';
  // 如果是b23.tv短链，先解析为BV号
  const bvidMatch=url.match(/\/video\/(BV[a-zA-Z0-9]{10})/);
  if(bvidMatch)return`https://player.bilibili.com/player.html?bvid=${bvidMatch[1]}&autoplay=1&high_quality=1&p=1`;
  const aidMatch=url.match(/\/video\/av(\d+)/i);
  if(aidMatch)return`https://player.bilibili.com/player.html?aid=${aidMatch[1]}&autoplay=1&high_quality=1&p=1`;
  // 直接传入bvid/av号
  const trimmed=url.trim();
  if(/^BV[a-zA-Z0-9]{10}$/.test(trimmed))return`https://player.bilibili.com/player.html?bvid=${trimmed}&autoplay=1&high_quality=1&p=1`;
  const avMatch=trimmed.match(/^av(\d+)$/i);
  if(avMatch)return`https://player.bilibili.com/player.html?aid=${avMatch[1]}&autoplay=1&high_quality=1&p=1`;
  // b23.tv 短链：直接用 iframe 加载让它自己跳转
  if(url.includes('b23.tv'))return`https://player.bilibili.com/player.html?autoplay=1&p=1&bvid=${encodeURIComponent(url)}`;
  return'';
}

function openBiliPlayer(url,title){
  const playWithBvid=(bvid)=>{
    const embed=`https://player.bilibili.com/player.html?bvid=${bvid}&autoplay=1&high_quality=1&p=1`;
    const modal=document.getElementById('videoModal')||createVideoModal();
    modal.querySelector('.vm-title').textContent=title||'B站视频';
    modal.querySelector('.vm-body').innerHTML=`<iframe src="${embed}" style="width:100%;height:100%;min-height:400px;border:none" allowfullscreen="true" allow="autoplay;encrypted-media;fullscreen"></iframe>`;
    modal.classList.add('show');
  };
  // 直接的BV号
  if(/^BV[a-zA-Z0-9]{10}$/.test(url)){playWithBvid(url);return}
  // 完整URL
  const directM=url.match(/\/video\/(BV[a-zA-Z0-9]{10})/);
  if(directM){playWithBvid(directM[1]);return}
  // b23.tv 短链 → 先解析
  if(url.includes('b23.tv')){
    // 在工作台端没法直接 fetch b23.tv（被沙箱挡），但 player.bilibili.com 可能接受完整URL
    const embed=`https://player.bilibili.com/player.html?bvid=${encodeURIComponent(url)}&autoplay=1&high_quality=1`;
    const modal=document.getElementById('videoModal')||createVideoModal();
    modal.querySelector('.vm-title').textContent=title||'B站视频';
    modal.querySelector('.vm-body').innerHTML=`<iframe src="${embed}" style="width:100%;height:100%;min-height:400px;border:none" allowfullscreen="true" allow="autoplay;encrypted-media;fullscreen"></iframe>`;
    modal.classList.add('show');
    return;
  }
  alert('无法解析B站视频链接');
}

let _fitDB=null;
function fitDB(){
  return new Promise((resolve,reject)=>{
    if(_fitDB)return resolve(_fitDB);
    const req=indexedDB.open('fitVideosDB',1);
    req.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:'id'})};
    req.onsuccess=e=>{_fitDB=e.target.result;resolve(_fitDB)};
    req.onerror=e=>reject(e.target.error);
  });
}
async function uploadFitLocalVideo(catId,input){
  const file=input.files[0];
  if(!file)return;
  const id='fitvid_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  const db=await fitDB();
  await new Promise((resolve,reject)=>{
    const tx=db.transaction('files','readwrite');
    tx.objectStore('files').put({id,file});
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
  st.fitLocalVids=st.fitLocalVids||{};
  st.fitLocalVids[catId]=st.fitLocalVids[catId]||[];
  st.fitLocalVids[catId].push({id,name:file.name,size:Math.round(file.size/1024/1024*10)/10+'MB',type:file.type});
  saveSt();
  input.value='';
  renderMain();
}
async function openLocalVideoPlayer(catId,idx){
  const v=st.fitLocalVids[catId][idx];
  if(!v)return;
  const db=await fitDB();
  const rec=await new Promise((resolve,reject)=>{
    const tx=db.transaction('files','readonly');
    const req=tx.objectStore('files').get(v.id);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
  if(!rec){alert('视频文件不存在');return}
  const url=URL.createObjectURL(rec.file);
  const modal=document.getElementById('videoModal')||createVideoModal();
  modal.querySelector('.vm-title').textContent=v.name||'本地视频';
  modal.querySelector('.vm-body').innerHTML=`<video src="${url}" controls autoplay style="width:100%;max-height:80vh"></video>`;
  modal.classList.add('show');
}
function delFitLocalVideo(catId,idx){
  if(!confirm('删除这个视频？'))return;
  const v=st.fitLocalVids[catId][idx];
  fitDB().then(db=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(v.id);tx.oncomplete=()=>{}});
  st.fitLocalVids[catId].splice(idx,1);
  saveSt();
  renderMain();
}
function uploadFitVidPhoto(catId,input){
  const files=[...input.files];
  st.fitVidPhotos=st.fitVidPhotos||{};
  st.fitVidPhotos[catId]=st.fitVidPhotos[catId]||[];
  let loaded=0;
  files.forEach(f=>{
    const reader=new FileReader();
    reader.onload=e=>{st.fitVidPhotos[catId].push(e.target.result);saveSt();loaded++;if(loaded===files.length)renderMain()};
    reader.readAsDataURL(f);
  });
  input.value='';
}
function delFitVidPhoto(catId,idx){
  st.fitVidPhotos[catId].splice(idx,1);
  saveSt();
  renderMain();
}
function openFitPhoto(catId,idx){
  const p=st.fitVidPhotos[catId][idx];
  const modal=document.getElementById('videoModal')||createVideoModal();
  modal.querySelector('.vm-title').textContent='照片';
  modal.querySelector('.vm-body').innerHTML=`<img src="${p}" style="max-width:100%;max-height:80vh;margin:auto;display:block">`;
  modal.classList.add('show');
}
function createVideoModal(){
  const m=document.createElement('div');
  m.id='videoModal';
  m.className='modal-overlay';
  m.onclick=function(e){if(e.target===m){m.classList.remove('show');m.querySelector('.vm-body').innerHTML=''}};
  m.innerHTML=`<div class="modal-content"><div class="modal-header"><h3 class="vm-title">视频播放</h3><button class="modal-close" onclick="document.getElementById('videoModal').classList.remove('show');document.getElementById('videoModal').querySelector('.vm-body').innerHTML=''">×</button></div><div class="modal-body vm-body"></div></div>`;
  document.body.appendChild(m);
  return m;
}
function getWeekData(mid){const d=[];for(let i=0;i<7;i++){const n=new Date();n.setDate(n.getDate()-((new Date().getDay()+6)%7)+i);const ds=localDate(n);d.push({date:ds,checked:(st.checkins[mid]||[]).includes(ds)});}return d;}
function toggleWeekDay(mid,date){const c=st.checkins[mid]||[];if(c.includes(date)){c.splice(c.indexOf(date),1);}else{c.push(date);}saveSt();renderMain();}

// ========== 健身每日任务（按日期直接编辑） ==========
function getDayTasks(date){if(!st.fitnessWeek)st.fitnessWeek={};if(!st.fitnessWeek[date])st.fitnessWeek[date]=[];return st.fitnessWeek[date];}
function getDayDone(date){const t=getDayTasks(date);return t.length?t.filter(x=>x.done).length:0;}
function addFitnessDayTaskByDate(date){const inp=document.getElementById('newFDay-'+date);if(!inp)return;const text=inp.value.trim();if(!text)return;getDayTasks(date).push({text,done:false});saveSt();renderMain();}
function delFitnessDayTaskByDate(date,idx){const tasks=getDayTasks(date);tasks.splice(idx,1);saveSt();renderMain();}
function toggleFitnessDayTaskByDate(date,idx){const tasks=getDayTasks(date);tasks[idx].done=!tasks[idx].done;saveSt();renderMain();}
function editFitnessDayTaskByDate(date,idx,el){const tasks=getDayTasks(date);const t=el.value.trim();if(t)tasks[idx].text=t;saveSt();}
function checkinFitnessDay(date){
  const c=st.checkins.fitness||[];
  if(c.includes(date)){c.splice(c.indexOf(date),1);saveSt();renderMain();return;}
  st.checkins.fitness=st.checkins.fitness||[];st.checkins.fitness.push(date);
  const s=streak(st.checkins.fitness),sk=s>=7?3:s>=3?2:1;
  st.food.fitness=(st.food.fitness||0)+sk;
  st.water.fitness=(st.water.fitness||0)+sk;
  st.trees.fitness=(st.trees.fitness||0)+1;
  st.treeWater=(st.treeWater||0)+sk;
  if(st.treeWater>=10){st.treeWater-=10;st.treeLevel=Math.min((st.treeLevel||0)+1,5);}
  saveSt();renderMain();
}

function renderDailyVocab(){
  const today=todayStr();
  // 每天更新：用日期作为种子选10个词+5个语句
  let seed=0;
  for(let i=0;i<today.length;i++)seed+=today.charCodeAt(i)*(i+1);
  // 按首字母分组，均匀采样避免同首字母扎堆
  const byLetter={};
  CET6_VOCAB.forEach((v,idx)=>{
    const L=(v.word[0]||'?').toUpperCase();
    if(!byLetter[L])byLetter[L]=[];
    byLetter[L].push({v,idx});
  });
  const letters=Object.keys(byLetter).sort();
  const words=[];
  let pick=seed;
  // 先每字母取1个，轮询直到凑够10个
  let round=0;
  while(words.length<10&&round<50){
    for(const L of letters){
      if(words.length>=10)break;
      const pool=byLetter[L];
      const item=pool[(pick+round)%pool.length];
      if(item&&!words.includes(item.v)){words.push(item.v);pick+=7;}
    }
    round++;
  }
  const sentStart=(seed%CET6_SENTENCES.length)%CET6_SENTENCES.length;
  const sents=[];
  for(let i=0;i<5;i++)sents.push(CET6_SENTENCES[(sentStart+i*7)%CET6_SENTENCES.length]);
  let h='<div class="card fade"><div class="card-title"><span class="dot"></span>📖 每日六级词汇<span style="font-size:10px;color:var(--text2);font-weight:400"> · 每天10词+5句 · 自动更新</span></div>';
  h+='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px">';
  words.forEach(v=>{
    h+=`<div style="border:1px solid var(--pink1);border-radius:5px;padding:3px 5px;background:var(--cream);min-height:32px">
      <div style="font-size:11px;font-weight:700;color:var(--pink6);line-height:1.2">${v.word}<span style="font-size:9px;color:var(--text2);font-weight:400;margin-left:2px">${v.phonetic}</span></div>
      <div style="font-size:9px;color:var(--text1);line-height:1.2;margin-top:1px">${v.meaning}</div>
    </div>`;
  });
  h+='</div>';
  h+='<div style="margin-top:4px;padding-top:4px;border-top:1px dashed var(--pink2)"><div style="font-size:10px;font-weight:600;color:var(--pink6);margin-bottom:3px">📝 每日5句</div>';
  h+='<div style="display:grid;grid-template-columns:1fr;gap:3px">';
  sents.forEach(s=>{
    h+=`<div style="padding:3px 5px;border:1px solid var(--pink1);border-radius:4px;background:var(--cream)">
      <div style="font-size:10px;font-weight:600;color:var(--text1);line-height:1.2">${s.en}</div>
      <div style="font-size:9px;color:var(--text2);line-height:1.2;margin-top:1px">${s.zh}</div>
    </div>`;
  });
  h+='</div></div></div>';
  return h;
}

function playEngVid(catId,idx){
  const vids=[...(ENG_VIDEOS[catId]||[]),...((st.engBiliVids&&st.engBiliVids[catId])||[])];
  const v=vids[idx];if(!v)return;
  const ep=st._engEp&&st._engEp[catId+'_'+idx]||1;
  openBiliPlayerWithEp(v.url,v.title,ep);
}
function playBiliP(catId,idx,ep){
  st._engEp=st._engEp||{};st._engEp[catId+'_'+idx]=parseInt(ep);saveSt();
  const vids=[...(ENG_VIDEOS[catId]||[]),...((st.engBiliVids&&st.engBiliVids[catId])||[])];
  const v=vids[idx];
  openBiliPlayerWithEp(v.url,v.title,parseInt(ep));
}
function openBiliPlayerWithEp(url,title,ep){
  const bvid=url.match(/(BV[a-zA-Z0-9]{10})/)?.[1]||url.match(/av(\d+)/i)?.[1]?.replace(/^/,'');
  if(!bvid){alert('无法解析B站视频');return}
  const isBV=/^BV/.test(bvid);
  const embed=isBV?`https://player.bilibili.com/player.html?bvid=${bvid}&autoplay=1&high_quality=1&p=${ep||1}`:`https://player.bilibili.com/player.html?aid=${bvid}&autoplay=1&high_quality=1&p=${ep||1}`;
  const modal=document.getElementById('videoModal')||createVideoModal();
  modal.querySelector('.vm-title').textContent=title||'B站视频';
  modal.querySelector('.vm-body').innerHTML=`<iframe src="${embed}" style="width:100%;height:100%;min-height:400px;border:none" allowfullscreen="true" allow="autoplay;encrypted-media;fullscreen"></iframe>`;
  modal.classList.add('show');
}
function addEngBili(catId){
  const n=document.getElementById('engBiliName-'+catId);const u=document.getElementById('engBiliUrl-'+catId);
  if(!n||!u)return;const name=n.value.trim()||'未命名';const url=u.value.trim();
  if(!url){alert('请输入B站链接或BV号');return}
  if(!bvidFromUrl(url)){alert('无法识别B站视频链接');return}
  st.engBiliVids=st.engBiliVids||{};st.engBiliVids[catId]=st.engBiliVids[catId]||[];
  st.engBiliVids[catId].push({title:name,url,dur:''});saveSt();
  n.value='';u.value='';renderMain();
}

        for(let p=1;p<=30;p++)h+=`<option value="${p}">P${p}</option>`;
        h+=`</select>`;
        if(isUser)h+=`<button class="btn btn-sm btn-sec" style="font-size:9px;padding:3px" onclick="delCSBili('${cat.id}',${i-presetCount})">🗑</button>`;
        h+=`</div></div>`;
      });
      if(!vids.length)h+=`<div style="font-size:10px;color:var(--text2);grid-column:1/-1;padding:4px">暂无视频</div>`;
      h+=`<div style="grid-column:1/-1;display:flex;gap:4px;margin-top:4px;flex-wrap:wrap">`;
      h+=`<input type="text" id="csBiliName-${cat.id}" placeholder="名称" style="flex:1;min-width:80px;padding:3px 6px;border:1px solid ${cat.color}33;border-radius:5px;font-size:9px;background:var(--card);outline:none">`;

}
function playCSVid(catId,idx){
  const vids=[...(CS_VIDEOS[catId]||[]),...((st.csBiliVids&&st.csBiliVids[catId])||[])];
  const v=vids[idx];if(!v)return;
  const ep=st._csEp&&st._csEp[catId+'_'+idx]||1;
  openBiliPlayerWithEp(v.url,v.title,ep);
}
function playCSP(catId,idx,ep){
  st._csEp=st._csEp||{};st._csEp[catId+'_'+idx]=parseInt(ep);saveSt();
  const vids=[...(CS_VIDEOS[catId]||[]),...((st.csBiliVids&&st.csBiliVids[catId])||[])];
  const v=vids[idx];
  openBiliPlayerWithEp(v.url,v.title,parseInt(ep));
}
function addCSBili(catId){
  const n=document.getElementById('csBiliName-'+catId);const u=document.getElementById('csBiliUrl-'+catId);
  if(!n||!u)return;const name=n.value.trim()||'未命名';const url=u.value.trim();
  if(!url){alert('请输入B站链接或BV号');return}
  if(!bvidFromUrl(url)){alert('无法识别B站视频链接');return}
  st.csBiliVids=st.csBiliVids||{};st.csBiliVids[catId]=st.csBiliVids[catId]||[];
  st.csBiliVids[catId].push({title:name,url,dur:''});saveSt();
  n.value='';u.value='';renderMain();
}
function delCSBili(catId,idx){st.csBiliVids[catId].splice(idx,1);saveSt();renderMain();}

function addExpense(){const amt=parseFloat(document.getElementById('expAmt').value);const cat=document.getElementById('expCat').value;const note=document.getElementById('expNote').value.trim();if(!amt||amt<=0){showModal('⚠️','请输入金额','金额必须大于0');return;}st.expenses.push({date:todayStr(),amount:amt,category:cat,note:note||'-'});document.getElementById('expAmt').value='';document.getElementById('expNote').value='';saveSt();renderMain();}
function delExp(idx){st.expenses.splice(idx,1);saveSt();renderMain();}
function addSavings(){const name=document.getElementById('saveName').value.trim();const target=parseFloat(document.getElementById('saveTarget').value);const current=parseFloat(document.getElementById('saveCurrent').value)||0;if(!name||!target){showModal('⚠️','信息不完整','请输入计划名称和目标金额');return;}st.savings.plans.push({name,target,current});document.getElementById('saveName').value='';document.getElementById('saveTarget').value='';document.getElementById('saveCurrent').value='';saveSt();renderMain();}
function addToPlan(idx){const amt=parseFloat(document.getElementById('planAdd-'+idx).value);if(!amt||amt<=0)return;st.savings.plans[idx].current+=amt;document.getElementById('planAdd-'+idx).value='';saveSt();renderMain();}

function skinDaysSince(last){if(!last)return 99;const diff=Math.floor((new Date(todayStr())-new Date(last))/86400000);return diff;}
function uploadHairImage(){const inp=document.getElementById('hairImgInp');const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{st.hairImages=st.hairImages||[];st.hairImages.push({id:Date.now(),img:e.target.result,name:f.name.slice(0,10)});saveSt();renderMain();};r.readAsDataURL(f);}
function delHairImage(idx){st.hairImages.splice(idx,1);saveSt();renderMain();}

// ========== 养猫种树游戏 ==========

  const details=MODS.filter(m=>m.hasFood).map(m=>`<span>${m.emoji} ${m.name}: 🐟${st.food[m.id]||0} 💧${st.water[m.id]||0}</span>`).join('<br>');

        <div class="asset-box"><div class="asset-icon">💧</div><div class="asset-num">${totalWater}</div><div class="asset-label">水滴</div></div>

      <div class="game-scene">

        <div class="cloud" style="top:35px;animation-delay:5s;animation-duration:20s">☁️</div>
        <div class="sky">☀️</div>
        <div class="kitty" id="gameKitty">🐱</div>
        <div class="tree" id="gameTree" style="${treeSize>=3?'font-size:40px':''}">
          <div class="trunk">🪵</div>
          <div class="leaves">${treeEmojis[Math.min(treeSize,5)]}</div>

        <div class="food-bowl">🥣</div>
        <div class="zombie" id="gameZombie">🧟</div>

      <div style="display:flex;gap:10px;justify-content:center;margin-bottom:10px;flex-wrap:wrap">

        <button class="btn btn-sec" style="padding:10px 24px;font-size:13px" onclick="waterTree()">💧 浇水树苗</button>
      </div>
      <div class="glog" id="glog"><div class="ent">🎮 点击投喂或浇水，小猫和小树会一起成长哦~</div></div>
      <div style="font-size:11px;color:var(--text2);margin-top:8px;line-height:1.8">
        ${details}
      </div>
    </div>
    <div class="card fade">
      <div class="card-title"><span class="dot"></span>🛒 猫粮兑换商店</div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:8px">每周多余的猫粮可以兑换奖励！</div>
      <div class="shop-grid">
        ${SHOP_ITEMS.map(item=>`<div class="shop-item">
          <div class="si-icon">${item.icon}</div>
          <div class="si-name">${item.name}</div>
          <div class="si-cost">🐟 ${item.cost} 袋猫粮</div>
          <button class="btn btn-pri si-btn" onclick="redeemItem('${item.id}')">兑换</button>
        </div>`).join('')}
      </div>
      <div style="margin-top:10px;font-size:11px;color:var(--text2)">
        ${st.redeemLog?.length?'<div style="font-weight:700;margin-bottom:4px">📝 本周兑换记录：</div>'+st.redeemLog.slice(-5).reverse().map(r=>`<div>${r.date}: ${r.item} (-${r.cost}🐟)</div>`).join(''):'还没有兑换记录'}
      </div>
    </div>
    <div class="card fade">
      <div class="card-title"><span class="dot"></span>🎮 游戏规则</div>
      <p style="font-size:12px;color:var(--text2);line-height:2">
        1️⃣ 完成 <b>Today计划、健身游泳、英语学习、计算机学习、健康饮食</b> 的每日打卡可获得猫粮和水滴奖励<br>

// ========== 我的页面 ==========
function renderMePage(main,t){
  const allMods=['today','fitness','english','computer','diet','beauty'];
  const summaries=allMods.map(id=>{
    const tasks=st.tasks[id]||[];
    const total=tasks.length,done=tasks.filter(x=>x.done).length;
    const c=st.checkins[id]||[];
    const s=streak(c);
    return {id,total,done,pct:total?Math.round(done/total*100):0,streak:s};
  });
  const allUndone=[];
  allMods.forEach(id=>{
    (st.tasks[id]||[]).forEach((task,i)=>{
      if(!task.done)allUndone.push({mod:id,modName:(MODS.find(m=>m.id===id)||{}).name||id,emoji:(MODS.find(m=>m.id===id)||{}).emoji||'📌',text:task.text,idx:i});
    });
  });
  const fitUndone=[];
  Object.entries(st.fitnessWeek||{}).forEach(([date,tasks])=>{
    tasks.forEach((task,i)=>{
      if(!task.done)fitUndone.push({mod:'fitnessWeek',modName:'健身(天)',emoji:'💪',text:`${dateLabel(date)}: ${task.text}`,idx:i,date});
    });
  });
  const hwUndone=(st.homework||[]).filter(h=>!h.done).map(h=>({mod:'homework',modName:'专业课作业',emoji:'📝',text:`${h.subject}: ${h.content}`,idx:0}));
  const allTasks=[...allUndone,...fitUndone,...hwUndone];
  const photoCount=st.photos.length;
  main.innerHTML=`
    <div class="me-footer fade">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:2px dashed var(--pink3)">
        <h2 style="font-size:18px;color:var(--pink6);display:flex;align-items:center;gap:6px"><span style="font-size:20px">👤</span>我的</h2>
        <div class="date-tag">📅 ${t}</div>
      </div>
      <div class="card">
        <div class="card-title"><span class="dot"></span>📸 我的美照墙<span style="font-size:10px;color:var(--text2);font-weight:400"> · ${photoCount}张</span></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:8px">
          ${st.photos.map((p,i)=>`<div style="position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--cream)">
            <img src="${p.img}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">
            <input value="${p.note||''}" placeholder="添加说明..." onchange="editPhotoNote(${i},this.value)" style="position:absolute;bottom:0;left:0;right:0;padding:3px 6px;border:none;background:rgba(255,255,255,0.85);font-size:10px;color:var(--text1);outline:none;text-align:center">
            <button onclick="delPhoto(${i})" style="position:absolute;top:2px;right:2px;background:rgba(255,255,255,0.8);border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;color:var(--pink5);line-height:1">×</button>
          </div>`).join('')}
          ${photoCount===0?`<div class="empty" style="grid-column:1/-1"><div class="icon">📸</div>还没有美照，快上传吧~</div>`:''}
        </div>
        <input type="file" id="photoInp" accept="image/*" style="display:none" onchange="uploadPhoto()">
        <button class="btn btn-pri btn-sm" onclick="document.getElementById('photoInp').click()">📷 上传美照</button>
      </div>
      <div class="card">
        <div class="card-title"><span class="dot"></span>📊 计划总览</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px">
          ${summaries.map(s=>{
            const mod=MODS.find(m=>m.id===s.id)||{};
            return `<div style="background:var(--cream);border-radius:8px;padding:7px;text-align:center;cursor:pointer" onclick="switchMod('${s.id}')">
              <div style="font-size:15px">${mod.emoji||'📌'}</div>
              <div style="font-size:10px;font-weight:700;color:var(--text1);margin:2px 0">${mod.name||s.id}</div>
              <div style="font-size:9px;color:var(--text2);line-height:1.4">
                <div>📋 ${s.done}/${s.total} (${s.pct}%)</div>
                <div>🔥 连续${s.streak}天</div>
              </div>
              <div class="progress-wrap" style="margin-top:3px"><div class="progress-fill" style="width:${s.pct}%"></div></div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-title"><span class="dot"></span>📝 待办任务总览<span style="font-size:9px;color:var(--text2);font-weight:400"> · ${allTasks.length}项</span></div>
        ${allTasks.length===0?`<div class="empty"><div class="icon">🎉</div>所有任务都完成啦，太棒了！</div>`:''}
        ${allTasks.slice(0,20).map(t=>`<div class="task-item" style="cursor:pointer;padding:3px 6px;gap:4px" onclick="switchMod('${t.mod==='homework'?'computer':t.mod==='fitnessWeek'?'fitness':t.mod}')">
          <div class="task-check" style="background:var(--pink2);color:var(--pink5);font-size:8px;width:16px;height:16px;min-width:16px">${t.emoji}</div>
          <span style="flex:1;font-size:10px">${t.text}</span>
          <span style="font-size:8px;color:var(--pink4);background:var(--pink1);padding:1px 5px;border-radius:8px">${t.modName}</span>
        </div>`).join('')}
        ${allTasks.length>20?`<div style="text-align:center;font-size:10px;color:var(--text2);margin-top:4px">...还有 ${allTasks.length-20} 项待办</div>`:''}
      </div>
      <div class="card">
        <div class="card-title"><span class="dot"></span>💭 每日总结</div>
        <textarea id="myDiary" style="width:100%;min-height:80px;padding:10px;border:1px solid var(--pink3);border-radius:10px;font-size:12px;background:var(--cream);resize:vertical;outline:none;line-height:1.8" placeholder="写写今天的感受、收获和反思..." onchange="st.mydiary=this.value;saveSt()">${st.mydiary||''}</textarea>
      </div>
    </div>`;
}
function uploadPhoto(){const inp=document.getElementById('photoInp');const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{st.photos.push({id:Date.now(),img:e.target.result,date:todayStr(),note:''});saveSt();renderMain();};r.readAsDataURL(f);}
function delPhoto(idx){st.photos.splice(idx,1);saveSt();renderMain();}
function editPhotoNote(idx,val){st.photos[idx].note=val;saveSt();}
function waterTree(){
  const totalWater=MODS.filter(m=>m.hasWater).reduce((s,m)=>s+(st.water[m.id]||0),0);
  if(totalWater<1){showModal('😿','水滴不足','请先完成打卡获得水滴！');return;}
  MODS.forEach(m=>{if(m.hasWater&&st.water[m.id]>0){st.water[m.id]--;return false;}});
  st.treeWater=(st.treeWater||0)+1;
  if(st.treeWater>=10){st.treeWater=0;st.treeLevel=Math.min((st.treeLevel||0)+1,5);}
  saveSt();renderMain();
}

resolveShortUrls().then(()=>renderMain());

}
